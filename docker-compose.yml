services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leadgensystem}
      POSTGRES_USER: ${POSTGRES_USER:-leadgensystem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://leadgensystem:change_me@db:5432/leadgensystem}
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python db/seed_admin.py && python -m worker.main"
    restart: unless-stopped
    shm_size: "1gb"

  dashboard:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://leadgensystem:change_me@db:5432/leadgensystem}
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python db/seed_admin.py && streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0"
    ports:
      - "8501:8501"
    restart: unless-stopped

  unsub:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://leadgensystem:change_me@db:5432/leadgensystem}
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn outreach.unsubscribe:create_app --factory --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard
      - unsub
    profiles:
      - prod


volumes:
  pgdata:
  caddy_data:
  caddy_config:
